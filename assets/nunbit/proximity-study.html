class="safe-zone" x="427" y="210" width="146" height="170" rx="36"/><path class="brackets" d="M421 241v-36h31m96 0h31v36M421 349v36h31m96 0h31v-36"/><text x="403" y="285" class="face-label" transform="rotate(-90 403 285)">FACE SAFE ZONE</text><line x1="500" y1="70" x2="500" y2="603" class="axis"/><line x1="64" y1="270" x2="936" y2="270" class="axis"/></g><g id="pathGroup"><polyline id="route-shadow"/><polyline id="route"/><g id="routeDots"></g><circle id="gaze-dot" cx="500" cy="270" r="8"/></g><g id="hud" tabindex="0" role="button" aria-label="HUD 정보 확인"><rect id="device-frame"/><rect id="hud-bg" rx="15"/><g id="hud-copy"></g><circle id="anchor-dot" r="3"/></g><g id="faceTarget" tabindex="0" role="button" aria-label="상대 얼굴 선택"><rect x="427" y="210" width="146" height="170" rx="36" fill="transparent"/><circle id="face-pulse" cx="500" cy="270" r="26"/><text id="face-action" x="500" y="402" text-anchor="middle"></text></g><g id="traceGroup"><polyline id="pointer-trace"/></g><text class="viewport-label" x="30" y="622">NUNBIT · VIEWPORT STUDY</text><text class="viewport-label" x="970" y="622" text-anchor="end">1000 × 650 / CONCEPT MODEL</text></svg></div><div class="scene-footer"><span><i></i>예상 읽기 경로 · 기하학적 모형</span><button id="replay">경로 재생 ↻</button></div></div><aside class="controls"><div class="control-title"><h3>배치 조절</h3><button id="reset">초기화 ↺</button></div><div class="control-block"><label for="amount">정보량<output id="amount-label"></output></label><input id="amount" type="range" min="1" max="3" value="2" step="1"></div><div class="control-block"><label for="x">좌우 위치<output id="x-label"></output></label><input id="x" type="range" min="130" max="870" value="515" step="1"></div><div class="control-block"><label for="y">높이<output id="y-label"></output></label><input id="y" type="range" min="85" max="565" value="113" step="1"></div><div class="toggles"><label><input type="checkbox" id="pathToggle" checked>경로 표시</label><label><input type="checkbox" id="safeToggle" checked>얼굴 보호 영역</label></div><div class="metrics" aria-live="polite"><div><span>왕복 경로 / 얼굴 너비</span><strong id="travel"></strong></div><div><span>보호 영역 가림</span><strong id="overlap"></strong></div></div><p class="note" id="note" aria-live="polite"></p></aside></div><script>const FACE={x:427,y:210,w:146,h:170};
const EYE={x:500,y:270};
const WIDTH=1000,HEIGHT=650;
const PRESETS={near:{x:500,y:270,amount:2},peripheral:{x:500,y:130,amount:2},screen:{x:820,y:270,amount:2}};
const heights={1:76,2:108,3:164};
function geometry(c){
 const w=244,h=heights[c.amount];
 const rect={x:c.x-w/2,y:c.y-h/2,w,h};
 const offsets=c.amount===1?[10]:c.amount===2?[-3,28]:[-30,4,36,62];
 const targets=offsets.map(dy=>({x:c.x,y:c.y+dy}));
 const points=[EYE,...targets,EYE];
 const gap=p=>Math.hypot(Math.max(FACE.x-p.x,0,p.x-FACE.x-FACE.w),Math.max(FACE.y-p.y,0,p.y-FACE.y-FACE.h));
 const distance=Math.max(...targets.map(gap))/FACE.w;
 const travel=points.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p.x-points[i].x,p.y-points[i].y),0)/FACE.w;
 const ix=Math.max(0,Math.min(rect.x+w,FACE.x+FACE.w)-Math.max(rect.x,FACE.x));
 const iy=Math.max(0,Math.min(rect.y+h,FACE.y+FACE.h)-Math.max(rect.y,FACE.y));
 return {rect,targets,points,distance,travel,overlap:ix*iy/(FACE.w*FACE.h)*100};
}
function clampConfig(c){return {x:Math.max(130,Math.min(870,Number(c.x)||515)),y:Math.max(85,Math.min(565,Number(c.y)||113)),amount:[1,2,3].includes(Number(c.amount))?Number(c.amount):2}}

function render(){const c=configs[selected],padding=selected==='screen'?12:0,minY=Math.max(85,heights[c.amount]/2+padding),maxY=Math.min(565,650-heights[c.amount]/2-padding);c.y=Math.max(minY,Math.min(maxY,c.y));$('y').min=minY;$('y').max=maxY;const g=geometry(c),r=g.rect;

 for(const [k,v]of Object.entries({x:r.x-8,y:r.y-12,width:r.w+16,height:r.h+24,rx:19}))$('device-frame').setAttribute(k,v);
 $('device-frame').style.display='none';$('hud-copy').replaceChildren();const x=r.x+18;
