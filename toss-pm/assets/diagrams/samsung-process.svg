<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310"><rect width="1080" height="310" fill="#f5f6fa"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="35" y="43" fill="#3f5368" font-size="18">SAMSUNG · 선행-양산 연계 5단계 게이트 프로세스</text><rect x="35" y="80" width="186" height="130" fill="white" rx="8"/><text x="51" y="115" font-size="14" fill="#3f5368">01</text><text x="51" y="150" font-size="19" fill="#171b25">과제 기획</text><text x="51" y="179" font-size="13" fill="#626875">범위 · 방향 설정</text><text x="231" y="151" fill="#626875" font-size="18">→</text><rect x="241" y="80" width="186" height="130" fill="white" rx="8"/><text x="257" y="115" font-size="14" fill="#3f5368">02</text><text x="257" y="150" font-size="19" fill="#171b25">컨셉 리뷰</text><text x="257" y="179" font-size="13" fill="#626875">Go · No-Go 판단</text><text x="437" y="151" fill="#626875" font-size="18">→</text><rect x="447" y="80" width="186" height="130" fill="white" rx="8"/><text x="463" y="115" font-size="14" fill="#3f5368">03</text><text x="463" y="150" font-size="19" fill="#171b25">디자인 기획</text><text x="463" y="179" font-size="13" fill="#626875">상세 설계</text><text x="643" y="151" fill="#626875" font-size="18">→</text><rect x="653" y="80" width="186" height="130" fill="white" rx="8"/><text x="669" y="115" font-size="14" fill="#3f5368">04</text><text x="669" y="150" font-size="19" fill="#171b25">디자인 리뷰</text><text x="669" y="179" font-size="13" fill="#626875">Go · No-Go 판단</text><text x="849" y="151" fill="#626875" font-size="18">→</text><rect x="859" y="80" width="186" height="130" fill="white" rx="8"/><text x="875" y="115" font-size="14" fill="#3f5368">05</text><text x="875" y="150" font-size="19" fill="#171b25">양산화 결정</text><text x="875" y="179" font-size="13" fill="#626875">이관 승인</text><text x="35" y="260" fill="#626875" font-size="16">Go · No-Go 판단 지점을 컨셉 리뷰 · 디자인 리뷰 · 양산화 결정 단계에 배치 · 실제 제안 구조를 단순화해 재구성</text></g></svg>
