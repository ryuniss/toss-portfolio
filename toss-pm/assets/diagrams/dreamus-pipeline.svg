<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310"><rect width="1080" height="310" fill="#f5f6fa"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="35" y="43" fill="#2939d9" font-size="18">DREAMUS · 대화를 생성 조건으로 바꾸는 처리 단계</text><rect x="35.0" y="80" width="237.5" height="130" fill="white" rx="8"/><text x="53.0" y="115" font-size="14" fill="#2939d9">01</text><text x="53.0" y="152" font-size="23" fill="#171b25">사용자 대화</text><text x="53.0" y="183" font-size="15" fill="#626875">입력 정책 검사</text><text x="275.5" y="151" fill="#626875" font-size="18">→</text><rect x="292.5" y="80" width="237.5" height="130" fill="white" rx="8"/><text x="310.5" y="115" font-size="14" fill="#2939d9">02</text><text x="310.5" y="152" font-size="23" fill="#171b25">정보 추출</text><text x="310.5" y="183" font-size="15" fill="#626875">장면 · 감정 · 맥락</text><text x="533.0" y="151" fill="#626875" font-size="18">→</text><rect x="550.0" y="80" width="237.5" height="130" fill="white" rx="8"/><text x="568.0" y="115" font-size="14" fill="#2939d9">03</text><text x="568.0" y="152" font-size="23" fill="#171b25">정보 요약</text><text x="568.0" y="183" font-size="15" fill="#626875">생성 요약 정책 검사</text><text x="790.5" y="151" fill="#626875" font-size="18">→</text><rect x="807.5" y="80" width="237.5" height="130" fill="white" rx="8"/><text x="825.5" y="115" font-size="14" fill="#2939d9">04</text><text x="825.5" y="152" font-size="23" fill="#171b25">형식 변환</text><text x="825.5" y="183" font-size="15" fill="#626875">JSON schema → 생성</text><text x="35" y="260" fill="#626875" font-size="17">정책에 저촉되는 표현 감지 시 자동 순화 · 당시 적용한 처리 방향의 요약</text></g></svg>